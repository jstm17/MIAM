name: Weekly Mongo Backup

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install MongoDB Database Tools
        run: |
          wget https://fastdl.mongodb.org/tools/db/mongodb-database-tools-ubuntu2204-x86_64-100.9.4.tgz
          tar -xvzf mongodb-database-tools-*.tgz
          sudo mv mongodb-database-tools-*/bin/* /usr/local/bin/

      - name: Dump MongoDB Atlas
        run: |
          mongodump \
            --uri="${{ secrets.MONGO_URI }}" \
            --archive=backup.gz \
            --gzip

      - name: Upload backup as artifact
        uses: actions/upload-artifact@v4
        with:
          name: backup-${{ github.run_id }}
          path: backup.gz
          retention-days: 30
