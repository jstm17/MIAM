name: MongoDB Backup to Drive

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install MongoDB Database Tools
        run: |
          wget https://fastdl.mongodb.org/tools/db/mongodb-database-tools-ubuntu2204-x86_64-100.9.4.tgz
          tar -xvzf mongodb-database-tools-*.tgz
          sudo mv mongodb-database-tools-*/bin/* /usr/local/bin/

      - name: Dump MongoDB Atlas
        run: |
          mongodump \
            --uri="${{ secrets.MONGO_URI }}" \
            --archive=backup.gz \
            --gzip

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Google API
        run: npm install googleapis

      - name: Create credentials.json
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: printenv GOOGLE_CREDENTIALS > credentials.json

      - name: Upload to Google Drive
        run: |
          echo "Folder ID: '${{ secrets.DRIVE_FOLDER_ID }}'"
          node <<EOF
          const { google } = require("googleapis");
          const fs = require("fs");

          async function upload() {
            const auth = new google.auth.GoogleAuth({
              keyFile: "credentials.json",
              scopes: ["https://www.googleapis.com/auth/drive.file"],
            });
            const drive = google.drive({ version: "v3", auth });
            await drive.files.create({
              supportsAllDrives: true,
              requestBody: {
                name: "backup-" + new Date().toISOString() + ".gz",
                parents: ["${{ secrets.DRIVE_FOLDER_ID }}"],
              },
              media: {
                mimeType: "application/gzip",
                body: fs.createReadStream("backup.gz"),
              },
            });
            console.log("Upload OK !");
          }
          upload();
          EOF
