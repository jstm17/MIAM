name: Weekly Mongo Backup

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install MongoDB tools
        run: |
          # Add MongoDB's official apt repository
          curl -fsSL https://www.mongodb.org/static/pgp/server-8.0.asc | \
            sudo gpg -o /usr/share/keyrings/mongodb-server-8.0.gpg --dearmor
          echo "deb [ arch=amd64,arm64 signed-by=/usr/share/keyrings/mongodb-server-8.0.gpg ] \
            https://repo.mongodb.org/apt/ubuntu noble/mongodb-org/8.0 multiverse" | \
            sudo tee /etc/apt/sources.list.d/mongodb-org-8.0.list
          sudo apt-get update
          sudo apt-get install -y mongodb-database-tools

      - name: Dump MongoDB
        run: |
          mongodump --uri="${{ secrets.MONGO_URI }}" \
            --archive=backup.gz --gzip

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20  # bump to 22 before June 2026 (see note below)

      - name: Install Google API
        run: npm install googleapis

      - name: Create credentials.json
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: printenv GOOGLE_CREDENTIALS > credentials.json

      - name: Upload to Google Drive
        run: |
          node <<EOF
          const { google } = require("googleapis");
          const fs = require("fs");

          async function upload() {
            const auth = new google.auth.GoogleAuth({
              keyFile: "credentials.json",
              scopes: ["https://www.googleapis.com/auth/drive.file"],
            });

            const drive = google.drive({ version: "v3", auth });

            await drive.files.create({
              requestBody: {
                name: "backup-" + new Date().toISOString() + ".gz",
                parents: ["${{ secrets.DRIVE_FOLDER_ID }}"],
              },
              media: {
                mimeType: "application/gzip",
                body: fs.createReadStream("backup.gz"),
              },
            });
          }

          upload();
          EOF
