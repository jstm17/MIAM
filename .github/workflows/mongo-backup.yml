name: MongoDB Backup to Drive

on:
  schedule:
    - cron: "0 3 * * 0"   # tous les dimanches à 3h
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # 🔥 INSTALLER MONGODB TOOLS (la pièce manquante)
      - name: Install MongoDB Database Tools
        run: |
          wget https://fastdl.mongodb.org/tools/db/mongodb-database-tools-ubuntu2204-x86_64-100.9.4.tgz
          tar -xvzf mongodb-database-tools-*.tgz
          sudo mv mongodb-database-tools-*/bin/* /usr/local/bin/

      # Test que mongodump existe
      - name: Check mongodump version
        run: mongodump --version

      # Backup MongoDB Atlas
      - name: Dump MongoDB Atlas
        run: |
          mongodump \
            --uri="${{ secrets.MONGO_URI }}" \
            --archive=backup.gz \
            --gzip

      # Upload vers Google Drive
      - name: Upload to Google Drive
        uses: mathisve/gdrive-upload-action@v1
        with:
          filename: backup.gz
          folderId: ${{ secrets.GDRIVE_FOLDER_ID }}
          credentials: ${{ secrets.GDRIVE_CREDENTIALS }}
